providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
cache:
  enabled: true
  backend: redis           # shared cache across gateway instances (requires docker compose up -d)
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 200            # ~80 provider calls/scenario: tight enough that a 5%
                           # provider fail_rate does not swamp the pass criteria
  concurrency: 1           # per-scenario override available; see concurrent_load below
  seed: 1234               # makes every sequential scenario reproducible

# Chaos scenarios: each overrides provider fail_rate for targeted testing.
# Scenarios 1-3 are the required failure modes; 4-6 cover the cache comparison,
# concurrent load, and a worst-case double degradation.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic should fallback"
    provider_overrides:
      primary: 1.0
  - name: primary_flaky_50
    description: "Primary provider fails 50% — circuit should oscillate"
    provider_overrides:
      primary: 0.5
  - name: all_healthy
    description: "Baseline — both providers healthy, no circuit should open"
    provider_overrides:
      primary: 0.0
      backup: 0.0
  - name: no_cache_baseline
    description: "Same load as all_healthy but with the cache switched off — cost/latency control group"
    provider_overrides:
      primary: 0.0
      backup: 0.0
    cache_enabled: false
  - name: concurrent_load
    description: "8 concurrent workers sharing one set of circuit breakers"
    provider_overrides:
      primary: 0.25
    concurrency: 8
  - name: primary_timeout_100_retry
    description: "Same as primary_timeout_100 but with one budgeted retry on the last live provider"
    provider_overrides:
      primary: 1.0
    max_retries_per_request: 1
    retry_budget_ratio: 0.1     # at most 10% of traffic may be retried
  - name: both_degraded
    description: "Primary 90% and backup 60% failure — expect static fallback and graceful degradation"
    provider_overrides:
      primary: 0.9
      backup: 0.6
